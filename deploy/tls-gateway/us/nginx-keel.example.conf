server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/keel-acme;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    server_name us.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/keel-us-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keel-us-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/null;

    location = /keel/mobile-ws {
        if ($http_upgrade != "websocket") {
            return 404;
        }
        proxy_pass http://127.0.0.1:19080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /sub/REPLACE_WITH_256_BIT_TOKEN.yaml {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /metrics-sync/REPLACE_WITH_256_BIT_SYNC_TOKEN.json {
        alias /var/lib/keel-quota/sync.json;
        default_type application/json;
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        return 404;
    }
}
