<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Keel · 本地实例控制台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">K</span>
        <div>
          <div class="brand-name">Keel</div>
          <p class="brand-subtitle">单实例本地控制台</p>
        </div>
      </div>
      <div class="console-actions">
        <a id="dashboard-link" class="button button-secondary dashboard-link" href="/devices" target="_blank" rel="noopener noreferrer" hidden>Grafana 仪表盘 <span aria-hidden="true">↗</span></a>
        <button id="refresh-button" class="button button-secondary" type="button">
          <span class="refresh-symbol" aria-hidden="true">↻</span>
          <span id="refresh-label">刷新数据</span>
        </button>
      </div>
    </header>

    <main>
      <div id="notice" class="notice" role="alert" hidden></div>
      <noscript><div class="notice notice-error">此控制台需要启用 JavaScript。</div></noscript>

      <section class="instance-card" aria-labelledby="instance-name">
        <div class="instance-heading">
          <div>
            <div class="instance-title-row">
              <h1 id="instance-name">正在读取实例</h1>
              <span id="status-pill" class="status-pill status-unknown">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="status-text">状态未知</span>
              </span>
            </div>
            <p class="project-line">项目 <span id="project-name">—</span></p>
          </div>
          <div class="instance-actions">
            <button id="start-button" class="button button-primary" type="button" disabled>启动实例</button>
            <button id="stop-button" class="button button-danger" type="button" disabled>停止实例</button>
          </div>
        </div>

        <dl class="details-grid">
          <div class="detail-item">
            <dt>可用区</dt>
            <dd id="zone-value">—</dd>
          </div>
          <div class="detail-item">
            <dt>机器类型</dt>
            <dd id="machine-type-value">—</dd>
          </div>
          <div class="detail-item">
            <dt>启动磁盘</dt>
            <dd id="boot-disk-value">—</dd>
          </div>
          <div class="detail-item">
            <dt>公网 IP</dt>
            <dd id="public-ip-value">—</dd>
          </div>
          <div class="detail-item updated-item">
            <dt>最后更新</dt>
            <dd id="updated-at-value">—</dd>
          </div>
        </dl>
      </section>
    </main>

  </div>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="dialog-title">
    <form id="confirm-form">
      <h2 id="dialog-title">确认操作</h2>
      <p id="dialog-description" class="dialog-description"></p>
      <p id="dialog-target" class="dialog-target"></p>
      <label class="confirm-label" for="confirm-input">输入实例名 <strong id="dialog-instance"></strong> 以确认</label>
      <input id="confirm-input" name="confirmation" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <div class="dialog-actions">
        <button id="cancel-action" class="button button-secondary" type="button">取消</button>
        <button id="confirm-action" class="button button-primary" type="submit" disabled>确认执行</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
